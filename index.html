<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Dashboard</title>
  <meta name="description" content="Personal start-of-day dashboard: weather, news, health, calendar and calorie tracking.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236155f5'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#home" aria-label="Dashboard home">
      <span class="brand-dot"></span>
      <span class="brand-name">Daily</span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <span class="tab-ind" aria-hidden="true"></span>
      <a href="#home" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </a>
      <a href="#health" data-tab="health">
        <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/><path d="M3.5 12h4l2-3 3 6 2-3h6"/></svg>
        <span>Health</span>
      </a>
      <a href="#workout" data-tab="workout">
        <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
        <span>My workout</span>
      </a>
      <a href="#calendar" data-tab="calendar">
        <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
        <span>Calendar</span>
      </a>
      <a href="#diet" data-tab="diet">
        <svg viewBox="0 0 24 24"><path d="M12 7c-1.5-2-5.5-2.5-7 .5S4.5 16 7 19.5c1.5 2 3 1.5 5 .5 2 1 3.5 1.5 5-.5 2.5-3.5 3.5-9 2-12S13.5 5 12 7z"/><path d="M12 7c0-2 1-3.5 3-4.5"/></svg>
        <span>Diet</span>
      </a>
    </nav>
    <button class="icon-btn" id="openSettings" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main>
    <section class="page" id="page-home" data-page="home"></section>
    <section class="page" id="page-health" data-page="health" hidden></section>
    <section class="page" id="page-workout" data-page="workout" hidden></section>
    <section class="page" id="page-calendar" data-page="calendar" hidden></section>
    <section class="page" id="page-diet" data-page="diet" hidden></section>
  </main>

  <dialog id="modal" class="modal">
    <div class="modal-inner">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div id="modalBody"></div>
    </div>
  </dialog>

  <div id="tooltip" class="tooltip" role="status" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/foods.js"></script>
  <script src="js/home.js"></script>
  <script src="js/health.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/diet.js"></script>
  <script src="js/workout.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
